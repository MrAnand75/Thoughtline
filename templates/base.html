<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Thoughtline{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav class="nav wrap"><a class="logo" href="/">thought<b>line.</b></a><div class="navlinks"><a href="/">Explore</a>{% if current_user %}<a href="{{url_for('new_post')}}">Write a post +</a><span>{{current_user.name}}</span><form method="post" action="{{url_for('logout')}}"><button class="btn light">Sign out</button></form>{% else %}<a href="{{url_for('login')}}">Sign in</a><a class="btn" href="{{url_for('register')}}">Join</a>{% endif %}</div></nav>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</body></html>
